<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" role="img" aria-labelledby="r-title r-desc">
            <title id="r-title">Runtime Docker y persistencia del host</title><desc id="r-desc">El host mantiene código, datos, checkout y daemon Docker. Un contenedor Codebot ejecuta controlador, agentes y supervisores. A través del socket crea contenedores E2E hermanos con mounts válidos del host.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="runtime-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="zone" x="15" y="15" width="1050" height="420" rx="18"/><text x="37" y="45" class="small">HOST · VM / SERVIDOR / DESARROLLO LOCAL</text>
            <rect class="box" x="35" y="75" width="240" height="105" rx="12"/><text x="55" y="106" class="title">Archivos persistentes</text><text x="55" y="134" class="small">coderbot/ → /app</text><text x="55" y="158" class="small">data/ → /app/data</text>
            <rect class="box" x="35" y="224" width="240" height="105" rx="12"/><text x="55" y="255" class="title">Checkout objetivo</text><text x="55" y="283" class="small">CODEBOT_REPO_PATH</text><text x="55" y="307" class="small">Misma ruta absoluta host/contenedor</text>
            <rect class="ctl" x="320" y="75" width="410" height="254" rx="14"/><text x="343" y="108" class="title">Contenedor codebot</text><text x="343" y="139">docker-init → Python main.py</text><text x="343" y="169" class="small">Agente headless + integración gestionada</text><text x="343" y="197" class="small">Worker lateral + supervisor STATUS</text><text x="343" y="225" class="small">Heartbeat + budgets + process cancellation</text><text x="343" y="253" class="small">Bindings de código / datos / checkout / sesión</text><text x="343" y="299" class="small">restart: unless-stopped · SIGTERM con recuperación</text>
            <rect class="box" x="785" y="75" width="250" height="105" rx="12"/><text x="806" y="107" class="title">Docker daemon del host</text><text x="806" y="136" class="small">/var/run/docker.sock</text><text x="806" y="159" class="small">Acceso privilegiado al runtime</text>
            <rect class="pass" x="785" y="224" width="250" height="105" rx="12"/><text x="806" y="256" class="title">Stacks E2E hermanos</text><text x="806" y="284" class="small">Frontend / backend / DB / tests</text><text x="806" y="308" class="small">Bind de resultados + proyecto por run</text>
            <path class="edge" style="marker-end:url(#runtime-arrow)" d="M275 128 H320 M275 276 H320 M730 128 H785 M910 180 V224"/>
            <text x="36" y="385" class="small">Red externa: GitHub / Jira / Google / Slack / proveedor LLM · credenciales configuradas en runtime</text>
            <text x="36" y="410" class="small">Cambiar código montado requiere reiniciar el proceso; cambiar herramientas o plugins de imagen puede requerir rebuild.</text>
          </svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-labelledby="c-title c-desc">
            <title id="c-title">Enrutamiento de mensajes y decisión humana</title><desc id="c-desc">Un mensaje se persiste y clasifica. Respuestas a decisiones van al controlador; conversación y cambios se registran lateralmente. Las respuestas preparadas se entregan mediante recibos sin alterar automáticamente la decisión pendiente.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="chat-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="human" x="30" y="50" width="205" height="90" rx="12"/><text x="50" y="84" class="title">Mensaje en hilo</text><text x="50" y="112" class="small">Texto íntegro + ID proveedor</text>
            <rect class="box" x="285" y="50" width="235" height="90" rx="12"/><text x="305" y="84" class="title">Registro durable</text><text x="305" y="112" class="small">conversation + task snapshot</text>
            <rect class="agent" x="570" y="50" width="235" height="90" rx="12"/><text x="590" y="84" class="title">Clasificación</text><text x="590" y="112" class="small">Reglas deterministas / modelo</text>
            <path class="edge" style="marker-end:url(#chat-arrow)" d="M235 95 H285 M520 95 H570"/>
            <rect class="ctl" x="570" y="205" width="235" height="92" rx="12"/><text x="590" y="240" class="title">Ruta flow → controlador</text><text x="590" y="268" class="small">Valida fase y versión de decisión</text>
            <rect class="agent" x="285" y="205" width="235" height="92" rx="12"/><text x="305" y="240" class="title">Ruta lateral → worker</text><text x="305" y="268" class="small">Respuesta / contexto / solicitud</text>
            <rect class="box" x="30" y="205" width="205" height="92" rx="12"/><text x="50" y="240" class="title">conversation_input</text><text x="50" y="268" class="small">Cambios y contexto retenidos</text>
            <rect class="human" x="855" y="205" width="195" height="92" rx="12"/><text x="875" y="239" class="title">Puerta de decisión</text><text x="875" y="267" class="small">Aprobar / responder / merge</text>
            <path class="edge" style="marker-end:url(#chat-arrow)" d="M687 140 V205 M640 140 V165 H402 V205 M285 251 H235 M805 251 H855"/>
            <rect class="pass" x="285" y="350" width="520" height="80" rx="12"/><text x="308" y="382" class="title">Respuesta persistida → recibos → entrega confirmada</text><text x="308" y="407" class="small">Si falla Slack/Email: reintentar transporte, no generar otra vez la respuesta</text>
            <path class="edge" style="marker-end:url(#chat-arrow)" d="M402 297 V350 M687 297 V350"/>
            <text x="855" y="87" class="small">STATUS / KICK</text><text x="855" y="111" class="small">Supervisor independiente</text>
          </svg>

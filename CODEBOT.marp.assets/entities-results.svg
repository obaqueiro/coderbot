<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 355 1160 420" role="img" aria-labelledby="entity-title entity-desc">
            <title id="entity-title">Componentes principales, entidades y relaciones de Codebot</title>
            <desc id="entity-desc">La instancia reclama tareas mediante adaptadores. Cada tarea vincula un workspace, una propuesta, conversaciones e intentos. El controlador administra el estado de ejecución. El runner produce resultados y checks; el ledger registra todo. Artefactos se publican mediante pasos de entrega y recibos.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="entity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <g style="marker-end:url(#entity-arrow)" fill="none" stroke="#86a0c0" stroke-width="2">
              <path d="M270 115 H315"/><path d="M580 115 H625"/><path d="M905 115 H950"/>
              <path d="M440 180 V220"/><path d="M760 180 V220"/><path d="M1035 180 V220"/>
              <path d="M315 123 H290 V274 H270"/><path d="M290 274 V429 H270"/>
              <path d="M440 330 V375"/><path d="M760 330 V375"/><path d="M1035 330 V375"/>
              <path d="M580 431 H625"/><path d="M905 431 H950"/>
              <path d="M760 485 V535"/><path d="M1035 485 V535"/>
              <path d="M315 431 H290 V588 H270"/><path d="M580 588 H625"/><path d="M905 588 H950"/>
              <path d="M440 650 V690 H760 V650"/>
            </g>
            <rect class="box" x="25" y="50" width="245" height="130" rx="12"/><text x="45" y="81" class="title">Instancia + adaptadores</text><text x="45" y="109" class="small">instance_id + fingerprint</text><text x="45" y="134" class="small">task_source / canales / GitHub</text><text x="45" y="159" class="small">Reclama y comunica una tarea</text>
            <rect class="ctl" x="315" y="50" width="265" height="130" rx="12"/><text x="336" y="81" class="title">Tarea · Task</text><text x="336" y="109" class="small">ID backend + execution_task_id</text><text x="336" y="134" class="small">Rama, base_sha, PR, propietario</text><text x="336" y="159" class="small">Raíz de registros relacionados</text>
            <rect class="ctl" x="625" y="50" width="280" height="130" rx="12"/><text x="646" y="81" class="title">Controlador + estado</text><text x="646" y="109" class="small">Estado de ejecución → state.json</text><text x="646" y="134" class="small">Fase, decisión, sesión, continuación</text><text x="646" y="159" class="small">Único dueño de transiciones</text>
            <rect class="pass" x="950" y="50" width="185" height="130" rx="12"/><text x="968" y="81" class="title">Ledger</text><text x="968" y="109" class="small">ExecutionStore</text><text x="968" y="134" class="small">SQLite WAL</text><text x="968" y="159" class="small">Identidad + estado</text>
            <rect class="box" x="25" y="220" width="245" height="110" rx="12"/><text x="45" y="252" class="title">Workspace + OpenSpec</text><text x="45" y="280" class="small">Checkout Git / commits / archivos</text><text x="45" y="306" class="small">Propuesta, diseño, specs y tareas</text>
            <rect class="human" x="315" y="220" width="265" height="110" rx="12"/><text x="336" y="252" class="title">Hilo + decisión + entradas</text><text x="336" y="280" class="small">conversation / conversation_input</text><text x="336" y="306" class="small">feedback + pregunta versionada</text>
            <rect class="agent" x="625" y="220" width="280" height="110" rx="12"/><text x="646" y="252" class="title">Runner + sesión de agente</text><text x="646" y="280" class="small">Claude / OpenCode · sesión / turnos</text><text x="646" y="306" class="small">Código, diagnósticos y contratos</text>
            <rect class="box" x="950" y="220" width="185" height="110" rx="12"/><text x="968" y="252" class="title">Intento + checkpoint</text><text x="968" y="280" class="small">phase_attempt</text><text x="968" y="306" class="small">checkpoint / operation</text>
            <rect class="box" x="25" y="375" width="245" height="110" rx="12"/><text x="45" y="407" class="title">Pull request + threads</text><text x="45" y="435" class="small">Objeto externo en GitHub</text><text x="45" y="461" class="small">Head, body, review y mergeability</text>
            <rect class="box" x="315" y="375" width="265" height="110" rx="12"/><text x="336" y="407" class="title">Servicio de comunicación</text><text x="336" y="435" class="small">Worker lateral + message_delivery</text><text x="336" y="461" class="small">Mensajes con recibos persistentes</text>
            <rect class="pass" x="625" y="375" width="280" height="110" rx="12"/><text x="646" y="407" class="title">Check / resultado / informe</text><text x="646" y="435" class="small">checks + final_checks → check_run</text><text x="646" y="461" class="small">Identidad de contenido y entorno</text>
            <rect class="box" x="950" y="375" width="185" height="110" rx="12"/><text x="968" y="407" class="title">Hallazgo / incidente</text><text x="968" y="435" class="small">finding / incident</text><text x="968" y="461" class="small">recovery / provenance</text>
            <rect class="box" x="25" y="535" width="245" height="115" rx="12"/><text x="45" y="568" class="title">Publicación externa</text><text x="45" y="596" class="small">Slack / Gmail / Drive / PR body</text><text x="45" y="623" class="small">Archivo o mensaje verificable</text>
            <rect class="pass" x="315" y="535" width="265" height="115" rx="12"/><text x="336" y="568" class="title">Entrega + recibo</text><text x="336" y="596" class="small">delivery_step / delivery_receipt</text><text x="336" y="623" class="small">Body + adjuntos + confirmaciones</text>
            <rect class="pass" x="625" y="535" width="280" height="115" rx="12"/><text x="646" y="568" class="title">Artefacto + manifiesto</text><text x="646" y="596" class="small">Vídeo, reporte, hash, tamaño, run_id</text><text x="646" y="623" class="small">artifact / outbox / manifest JSON</text>
            <rect class="ctl" x="950" y="535" width="185" height="115" rx="12"/><text x="968" y="568" class="title">Evidencia</text><text x="968" y="596" class="small">Captura / validación</text><text x="968" y="623" class="small">Conversión / entrega</text>
            <text x="25" y="722" class="small">Relaciones conceptuales: una tarea agrupa múltiples intentos, checks, mensajes, artefactos y pasos de entrega por task_id.</text>
            <text x="25" y="749" class="small">Cada tabla del ledger comparte id, task_id, parent_id, identity, status, timestamps y data JSON; no es un esquema con FKs dibujadas aquí.</text>
          </svg>

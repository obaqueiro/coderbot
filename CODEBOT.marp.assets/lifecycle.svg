<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="f-title f-desc">
            <title id="f-title">Ciclo de vida de una tarea y principales recuperaciones</title><desc id="f-desc">Selección, exploración, propuesta y aprobación preceden a implementación, verificación, revisión, E2E, archivo y PR. Revisión externa y evidencia preceden a la decisión de merge. Fallos conducen a reparación o espera humana.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <g style="--unused:0"><path class="edge" style="marker-end:url(#flow-arrow)" d="M245 83 H285 M530 83 H570 M815 83 H855 M955 120 V180 M855 218 H815 M570 218 H530 M285 218 H245 M145 256 V315 M245 353 H285 M530 353 H570 M815 353 H855 M955 391 V450 M855 488 H815 M570 488 H530 M285 488 H245"/></g>
            <rect class="ctl" x="45" y="45" width="200" height="75" rx="12"/><text x="145" y="77" text-anchor="middle" class="mono">IDLE → selección</text><text x="145" y="101" text-anchor="middle" class="small">Claim + rama + base_sha</text>
            <rect class="agent" x="285" y="45" width="245" height="75" rx="12"/><text x="407" y="77" text-anchor="middle" class="mono">EXPLORING</text><text x="407" y="101" text-anchor="middle" class="small">Contexto y requisitos</text>
            <rect class="agent" x="570" y="45" width="245" height="75" rx="12"/><text x="692" y="77" text-anchor="middle" class="mono">PROPOSING</text><text x="692" y="101" text-anchor="middle" class="small">Propuesta / diseño / tareas</text>
            <rect class="human" x="855" y="45" width="200" height="75" rx="12"/><text x="955" y="77" text-anchor="middle" class="mono">WAIT_APPROVAL</text><text x="955" y="101" text-anchor="middle" class="small">Autorización de producto</text>
            <rect class="agent" x="855" y="180" width="200" height="76" rx="12"/><text x="955" y="212" text-anchor="middle" class="mono">IMPLEMENTING</text><text x="955" y="237" text-anchor="middle" class="small">Código + tests + commits</text>
            <rect class="pass" x="570" y="180" width="245" height="76" rx="12"/><text x="692" y="212" text-anchor="middle" class="mono">VERIFYING</text><text x="692" y="237" text-anchor="middle" class="small">QUALITY_GATE + OpenSpec CLI</text>
            <rect class="pass" x="285" y="180" width="245" height="76" rx="12"/><text x="407" y="212" text-anchor="middle" class="mono">INTERNAL_REVIEW</text><text x="407" y="237" text-anchor="middle" class="small">Revisión independiente</text>
            <rect class="pass" x="45" y="180" width="200" height="76" rx="12"/><text x="145" y="212" text-anchor="middle" class="mono">E2E / final checks</text><text x="145" y="237" text-anchor="middle" class="small">Controlador ejecuta suites</text>
            <rect class="ctl" x="45" y="315" width="200" height="76" rx="12"/><text x="145" y="347" text-anchor="middle" class="mono">ARCHIVING</text><text x="145" y="372" text-anchor="middle" class="small">Sync + archivo OpenSpec</text>
            <rect class="ctl" x="285" y="315" width="245" height="76" rx="12"/><text x="407" y="347" text-anchor="middle" class="mono">OPEN_PR</text><text x="407" y="372" text-anchor="middle" class="small">Push + PR + actualización ticket</text>
            <rect class="pass" x="570" y="315" width="245" height="76" rx="12"/><text x="692" y="347" text-anchor="middle" class="mono">WAIT_REVIEW ↔ reparación</text><text x="692" y="372" text-anchor="middle" class="small">Si existe workflow Code Review</text>
            <rect class="pass" x="855" y="315" width="200" height="76" rx="12"/><text x="955" y="347" text-anchor="middle">Evidencia + entrega</text><text x="955" y="372" text-anchor="middle" class="small">MP4 / reporte validado</text>
            <rect class="human" x="855" y="450" width="200" height="76" rx="12"/><text x="955" y="482" text-anchor="middle" class="mono">WAIT_MERGE</text><text x="955" y="507" text-anchor="middle" class="small">Decisión sobre la PR</text>
            <rect class="ctl" x="570" y="450" width="245" height="76" rx="12"/><text x="692" y="482" text-anchor="middle">Comprobar y fusionar</text><text x="692" y="507" text-anchor="middle" class="small">Snapshot + conflictos + threads</text>
            <rect class="ctl" x="285" y="450" width="245" height="76" rx="12"/><text x="407" y="482" text-anchor="middle">Cerrar tarea y liberar claim</text><text x="407" y="507" text-anchor="middle" class="small">Estado Done / actividad</text>
            <rect class="ctl" x="45" y="450" width="200" height="76" rx="12"/><text x="145" y="482" text-anchor="middle" class="mono">IDLE</text><text x="145" y="507" text-anchor="middle" class="small">Siguiente tarea</text>
            <text x="45" y="578" class="small">RUTAS ALTERNAS: WAIT_REPLY / WAIT_STUCK · REPAIR_CHECKS · REPLANNING · RESOLVE_CONFLICTS · PUSHING</text>
            <text x="45" y="602" class="small">No son atajos de aprobación: conservan el trabajo y vuelven a las puertas que corresponden.</text>
          </svg>

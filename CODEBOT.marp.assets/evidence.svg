<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 515" role="img" aria-labelledby="e-title e-desc">
            <title id="e-title">Pipeline de evidencia y reparación automática</title><desc id="e-desc">Se reconcilia evidencia previa, se graban demos y se valida el run. Si es incompleto se genera la suite seleccionada completa. Fallos persistentes activan implementación, revisión, checks y recaptura. Solo después se convierte, publica, sincroniza la PR y confirma entrega.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="ev-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="box" x="25" y="35" width="230" height="96" rx="12"/><text x="45" y="67" class="title">Reconciliar / reutilizar</text><text x="45" y="94" class="small">Manifiesto + snapshot + hash</text><text x="45" y="116" class="small">Drive y enlace PR, si existe</text>
            <rect class="ctl" x="295" y="35" width="230" height="96" rx="12"/><text x="315" y="67" class="title">Grabar demos</text><text x="315" y="94" class="small">--grep @evidence</text><text x="315" y="116" class="small">PW_VIDEO</text>
            <rect class="pass" x="565" y="35" width="230" height="96" rx="12"/><text x="585" y="67" class="title">Validar run + vídeos</text><text x="585" y="94" class="small">Exit + JSON + casos + media</text><text x="585" y="116" class="small">Demos de cada spec seleccionado</text>
            <rect class="ctl" x="835" y="35" width="220" height="96" rx="12"/><text x="855" y="67" class="title">Convertir a MP4</text><text x="855" y="94" class="small">ffmpeg → H.264 / 1280×720</text><text x="855" y="116" class="small">ffprobe: vídeo y duración</text>
            <path class="edge" style="marker-end:url(#ev-arrow)" d="M255 83 H295 M525 83 H565 M795 83 H835"/>
            <rect class="human" x="295" y="201" width="230" height="101" rx="12"/><text x="315" y="233" class="title">Generar run completo</text><text x="315" y="260" class="small">Mismos specs, sin --grep</text><text x="315" y="284" class="small">No aceptar el run rechazado</text>
            <rect class="fail" x="565" y="201" width="490" height="101" rx="12"/><text x="587" y="233" class="title">Falta evidencia o implementación → reparación</text><text x="587" y="260" class="small">REPAIR_CHECKS → implementar lo faltante → EVIDENCE_REVIEW</text><text x="587" y="284" class="small">Controles completos → PUSHING → revisión externa si aplica → recaptura</text>
            <path class="edge" style="marker-end:url(#ev-arrow)" d="M680 131 V164 H410 V201 M525 251 H565"/>
            <path class="edge dash" style="marker-end:url(#ev-arrow)" d="M295 251 H274 V164 H606 V131 M810 302 V331 H274 V116 H295"/>
            <text x="28" y="222" class="small">La PR sigue bloqueada.</text><text x="28" y="248" class="small">Clips fallidos se preservan</text><text x="28" y="272" class="small">solo para diagnóstico.</text>
            <rect class="pass" x="835" y="380" width="220" height="95" rx="12"/><text x="855" y="413" class="title">UPLOAD + ACCESS</text><text x="855" y="440" class="small">Drive: archivo y ACL heredada</text><text x="855" y="461" class="small">O adjunto MP4 permitido</text>
            <rect class="pass" x="565" y="380" width="230" height="95" rx="12"/><text x="585" y="413" class="title">PR_SYNC</text><text x="585" y="440" class="small">Sección de vídeo del bot</text><text x="585" y="461" class="small">Lectura posterior confirma cambio</text>
            <rect class="pass" x="295" y="380" width="230" height="95" rx="12"/><text x="315" y="413" class="title">NOTIFY + recibos</text><text x="315" y="440" class="small">Compartir enlace / archivo real</text><text x="315" y="461" class="small">No solo anunciar «disponible»</text>
            <rect class="human" x="25" y="380" width="230" height="95" rx="12"/><text x="45" y="413" class="title">PR lista para revisar</text><text x="45" y="440" class="small">Cover + verificación + evidencia</text><text x="45" y="461" class="small">La decisión de merge sigue aparte</text>
            <path class="edge" style="marker-end:url(#ev-arrow)" d="M945 131 V178 H1066 V427 H1055 M835 427 H795 M565 427 H525 M295 427 H255"/>
          </svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 325" role="img" aria-labelledby="p-title p-desc">
            <title id="p-title">Persistencia y recuperación de Codebot</title><desc id="p-desc">El estado de ejecución indica la fase; SQLite conserva resultados e identidades; Git y outbox conservan código y artefactos. Tras reiniciar se reconcilian esas fuentes, se validan hashes y se reanuda el paso pendiente.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="persist-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="ctl" x="25" y="30" width="310" height="135" rx="12"/><text x="47" y="64" class="title" style="font-size:15px">state.json · estado de ejecución</text><text x="47" y="93" class="small">Tarea / rama / fase / sesión / PR</text><text x="47" y="118" class="small">Pregunta + aprobación + return_state</text><text x="47" y="143" class="small">Contextos de push y reparación</text>
            <rect class="pass" x="385" y="30" width="310" height="135" rx="12"/><text x="407" y="64" class="title">execution.sqlite · ledger</text><text x="407" y="93" class="small">Intentos, operaciones y checkpoints</text><text x="407" y="118" class="small">Checks, feedback, conversación</text><text x="407" y="143" class="small">Artefactos, procedencia y recibos</text>
            <rect class="box" x="745" y="30" width="310" height="135" rx="12"/><text x="767" y="64" class="title">Git + outbox · realidad</text><text x="767" y="93" class="small">Commits / worktree / OpenSpec</text><text x="767" y="118" class="small">Logs / vídeo / manifiestos / hashes</text><text x="767" y="143" class="small">Recibos y resultados observables</text>
            <rect class="ctl" x="220" y="228" width="640" height="68" rx="12"/><text x="540" y="257" text-anchor="middle" class="title">Reconciliar → verificar vigencia → continuar lo pendiente</text><text x="540" y="280" text-anchor="middle" class="small">No resetear trabajo · no inventar éxito · no duplicar efectos externos inciertos</text>
            <path class="edge" style="marker-end:url(#persist-arrow)" d="M180 165 V210 H340 V228 M540 165 V228 M900 165 V210 H740 V228"/>
          </svg>

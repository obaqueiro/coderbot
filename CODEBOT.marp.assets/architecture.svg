<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 565" role="img" aria-labelledby="a-title a-desc">
            <title id="a-title">Arquitectura de componentes de Codebot</title><desc id="a-desc">Backlogs y canales conversan con el controlador. Este coordina agentes, repositorio, verificación, evidencia y almacenamiento persistente.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="zone" x="276" y="18" width="526" height="530" rx="18"/><text x="298" y="44" class="small">PROCESO CODEBOT · CONTROL + EJECUCIÓN</text>
            <rect class="box" x="20" y="74" width="225" height="112" rx="12"/><text x="40" y="105" class="title">Backlog</text><text x="40" y="132">Jira · Projects v2 · GDoc</text><text x="40" y="159" class="small">task_source → claim / status</text>
            <rect class="human" x="20" y="236" width="225" height="123" rx="12"/><text x="40" y="269" class="title">Persona + hilo de tarea</text><text x="40" y="297">Slack / Email</text><text x="40" y="325" class="small">Decisiones · cambios · preguntas</text>
            <rect class="ctl" x="311" y="84" width="456" height="121" rx="14"/><text x="334" y="119" class="title">main.py · máquina de estados</text><text x="334" y="150">Fases · política · aprobaciones · publicación</text><text x="334" y="177" class="small">Un único dueño del estado de ejecución y las transiciones</text>
            <rect class="agent" x="311" y="257" width="213" height="113" rx="12"/><text x="331" y="287" class="title">agent_runner</text><text x="331" y="314">Claude / OpenCode</text><text x="331" y="342" class="small">Sesiones + skills + contratos</text>
            <rect class="pass" x="553" y="257" width="214" height="113" rx="12"/><text x="573" y="287" class="title">Controles + evidencia</text><text x="573" y="314">checks · evidence_delivery</text><text x="573" y="342" class="small">Pruebas, artefactos y recibos</text>
            <rect class="box" x="311" y="427" width="456" height="91" rx="12"/><text x="334" y="460" class="title">Estado durable + repositorio objetivo</text><text x="334" y="489" class="small">state.json · execution.sqlite · outbox · Git / OpenSpec</text>
            <rect class="box" x="836" y="77" width="224" height="109" rx="12"/><text x="855" y="109" class="title">GitHub</text><text x="855" y="136">PR · review · checks</text><text x="855" y="161" class="small">gh CLI / API · push / merge</text>
            <rect class="box" x="836" y="254" width="224" height="113" rx="12"/><text x="855" y="286" class="title">Proveedor + herramientas</text><text x="855" y="313">LLM · shell · Docker</text><text x="855" y="339" class="small">E2E en stacks del host</text>
            <rect class="pass" x="836" y="427" width="224" height="91" rx="12"/><text x="855" y="459" class="title">Drive + conversación</text><text x="855" y="488" class="small">MP4, enlace PR y entrega real</text>
            <path class="edge" d="M245 131 H311"/><path class="edge" d="M245 287 H276 V168 H311"/>
            <path class="edge" d="M767 132 H836"/><path class="edge" d="M418 205 V257"/><path class="edge" d="M660 205 V257"/>
            <path class="edge" d="M418 370 V427"/><path class="edge" d="M660 370 V427"/><path class="edge" d="M767 314 H836"/>

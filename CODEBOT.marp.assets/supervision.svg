<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 555" role="img" aria-labelledby="super-title super-desc">
            <title id="super-title">Supervisión del proceso principal por hilos internos y procesos externos</title><desc id="super-desc">El proceso Python contiene FSM, STATUS, heartbeat y worker lateral. STATUS lee actividad y puede cancelar procesos por rol sin modificar la FSM. Heartbeat actualiza un archivo condicionado a liveness. El healthcheck externo lee su edad y termina PID 1 ante estancamiento duro; docker-init propaga señales y Compose reinicia.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="super-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="zone" x="20" y="20" width="715" height="397" rx="16"/><text x="40" y="49" class="small">MISMO PROCESO PYTHON · hilos, locks y snapshots compartidos</text>
            <rect class="ctl" x="40" y="80" width="305" height="110" rx="12"/><text x="61" y="113" class="title">Hilo principal · FSM</text><text x="61" y="142" class="small">_run_loop / estado / checkpoints</text><text x="61" y="168" class="small">Único dueño de las transiciones</text>
            <rect class="box" x="395" y="80" width="315" height="110" rx="12"/><text x="416" y="113" class="title">Supervisor STATUS + progreso</text><text x="416" y="142" class="small">Lee actividad; responde sin turno LLM</text><text x="416" y="168" class="small">KICK / VERIFY → cancelar, no cambiar FSM</text>
            <rect class="agent" x="40" y="260" width="305" height="110" rx="12"/><text x="61" y="293" class="title">Worker lateral</text><text x="61" y="322" class="small">Clasifica, responde y entrega mensajes</text><text x="61" y="348" class="small">Registra mensajes; no controla el estado</text>
            <rect class="pass" x="395" y="260" width="315" height="110" rx="12"/><text x="416" y="293" class="title">Hilo heartbeat</text><text x="416" y="322" class="small">operations + edad del tick</text><text x="416" y="348" class="small">Escribe data/heartbeat si hay liveness</text>
            <rect class="box" x="795" y="80" width="300" height="110" rx="12"/><text x="816" y="113" class="title">Healthcheck externo · Docker</text><text x="816" y="142" class="small">Lee edad del archivo heartbeat</text><text x="816" y="168" class="small">Umbral duro → señal a PID 1</text>
            <rect class="ctl" x="795" y="260" width="300" height="110" rx="12"/><text x="816" y="293" class="title">docker-init + Compose</text><text x="816" y="322" class="small">Propagar señales / recoger huérfanos</text><text x="816" y="348" class="small">Proceso termina → unless-stopped</text>
            <rect class="box" x="40" y="460" width="670" height="70" rx="12"/><text x="61" y="490" class="title">Procesos hijos: agente CLI / bridge / checks / ffmpeg</text><text x="61" y="514" class="small">operations: presupuestos y grupos; turn_control: SIGTERM → escalación SIGKILL por rol</text>
            <rect class="box" x="795" y="460" width="300" height="70" rx="12"/><text x="816" y="490" class="title">Watcher temporal opcional</text><text x="816" y="514" class="small">status_watch.py · solo STATUS Slack</text>
            <g fill="none" stroke="#86a0c0" stroke-width="2" marker-end="url(#super-arrow)"><path d="M395 137 H345 M345 315 H395 M553 260 V208 H192 V190 M710 310 H759 V137 H795 M945 190 V260 M192 190 V220 H365 V460"/></g>
            <path fill="none" stroke="#86a0c0" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#super-arrow)" d="M795 316 H759 V54 H192 V80"/>
          </svg>

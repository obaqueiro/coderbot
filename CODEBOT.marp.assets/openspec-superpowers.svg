<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="os-title os-desc">
            <title id="os-title">Relación de OpenSpec, Superpowers, agente y controlador Codebot</title><desc id="os-desc">OpenSpec aporta acuerdo y artefactos; Superpowers aporta disciplina al agente. La skill puente mantiene los límites de orquestación. El agente entrega implementación y contratos al controlador, que valida OpenSpec, ejecuta controles y gestiona aprobación, archivo y PR.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="os-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="box" x="25" y="35" width="315" height="125" rx="12"/><text x="47" y="70" class="title">OpenSpec · qué y por qué</text><text x="47" y="100" class="small">Propuesta / diseño / specs / tasks</text><text x="47" y="128" class="small">CLI: instrucciones, progreso, validación</text>
            <rect class="agent" x="395" y="35" width="320" height="125" rx="12"/><text x="417" y="70" class="title">Superpowers · cómo</text><text x="417" y="100" class="small">Brainstorming / TDD / debugging</text><text x="417" y="128" class="small">Revisión independiente / evidencia honesta</text>
            <rect class="ctl" x="770" y="35" width="325" height="125" rx="12"/><text x="792" y="70" class="title">Codebot · cuándo avanzar</text><text x="792" y="100" class="small">FSM / aprobación / gates / checkpoints</text><text x="792" y="128" class="small">Archivo / push / PR / merge</text>
            <rect class="box" x="155" y="220" width="810" height="78" rx="12"/><text x="560" y="251" text-anchor="middle" class="title">Skill puente: coderbot-openspec-workflow</text><text x="560" y="277" text-anchor="middle" class="small">Plan aprobado como referencia · disciplina por fase · no terminar la rama ni publicar desde el agente</text>
            <rect class="agent" x="25" y="354" width="520" height="88" rx="12"/><text x="47" y="387" class="title">Agente: aplica las skills sobre el checkout</text><text x="47" y="416" class="small">Código + tests + commits locales + QUALITY_GATE / INTERNAL_REVIEW</text>
            <rect class="pass" x="605" y="354" width="490" height="88" rx="12"/><text x="627" y="387" class="title">Controlador: comprueba y coordina</text><text x="627" y="416" class="small">CLI OpenSpec + suites completas + evidencia + decisión humana</text>
            <g fill="none" stroke="#86a0c0" stroke-width="2" marker-end="url(#os-arrow)"><path d="M183 160 V220 M555 160 V220 M933 160 V220 M285 298 V354 M835 298 V354 M545 399 H605"/></g>
          </svg>

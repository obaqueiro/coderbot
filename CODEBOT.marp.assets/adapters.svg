<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="ports-title ports-desc">
            <title id="ports-title">Fachadas y adaptadores para Project Management, Communication y agentes</title><desc id="ports-desc">El núcleo consume task_source para Jira, Projects o Google Doc; conversation para Gmail o Slack; y agent_runner para Claude u OpenCode. Checks usan un plan extensible del proyecto. GitHub y Drive son integraciones concretas, no proveedores intercambiables implementados.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="ports-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="ctl" x="30" y="40" width="265" height="537" rx="15"/><text x="53" y="79" class="title">Núcleo de Codebot</text><text x="53" y="110" class="small">main.py · FSM y gates</text><text x="53" y="140" class="small">Tarea, propuesta y decisiones</text><text x="53" y="170" class="small">Ledger / checks / evidencia</text><text x="53" y="221" class="title">Contratos, no proveedores</text><text x="53" y="253" class="small">Datos de tarea normalizados</text><text x="53" y="284" class="small">Hilo y recibos opacos al flujo</text><text x="53" y="315" class="small">Resultado de agente normalizado</text><text x="53" y="373" class="title">Selección al arrancar</text><text x="53" y="405" class="small">config.py + validación</text><text x="53" y="436" class="small">Imports/dispatch según backend</text><text x="53" y="501" class="small">Cambiar proveedor implica validar</text><text x="53" y="529" class="small">contrato, configuración y acceso.</text>
            <rect class="box" x="355" y="40" width="320" height="115" rx="12"/><text x="376" y="72" class="title">Project Management · task_source</text><text x="376" y="101" class="small">list / claim / hold / done / note_pr</text><text x="376" y="130" class="small">CODEBOT_TASK_SOURCE</text>
            <rect class="box" x="735" y="40" width="350" height="115" rx="12"/><text x="757" y="72" class="title">Jira / Projects v2 / Google Doc</text><text x="757" y="101" class="small">jira_client / github_projects_client</text><text x="757" y="130" class="small">gdoc_client · workflow específico</text>
            <rect class="box" x="355" y="185" width="320" height="115" rx="12"/><text x="376" y="217" class="title">Communication · conversation</text><text x="376" y="246" class="small">send / poll / thread / delivery / progress</text><text x="376" y="275" class="small">CODEBOT_COMM_CHANNEL</text>
            <rect class="human" x="735" y="185" width="350" height="115" rx="12"/><text x="757" y="217" class="title">Gmail / Slack</text><text x="757" y="246" class="small">gmail_client / slack_client</text><text x="757" y="275" class="small">Polling / Socket Mode · recibos</text>
            <rect class="box" x="355" y="330" width="320" height="115" rx="12"/><text x="376" y="362" class="title">Agent Execution · agent_runner</text><text x="376" y="391" class="small">run / resume / converse + eventos</text><text x="376" y="420" class="small">CODEBOT_AGENT · modelo / transporte</text>
            <rect class="agent" x="735" y="330" width="350" height="115" rx="12"/><text x="757" y="362" class="title">Claude Code / OpenCode</text><text x="757" y="391" class="small">CLI / bridge HTTP según selección</text><text x="757" y="420" class="small">Integración OpenSpec y skills gestionadas</text>
            <rect class="box" x="355" y="475" width="320" height="102" rx="12"/><text x="376" y="507" class="title">Verificación · plan del proyecto</text><text x="376" y="536" class="small">checks.json / descubrimiento / reporter</text><text x="376" y="559" class="small">Comandos completos y focalizados</text>
            <rect class="pass" x="735" y="475" width="350" height="102" rx="12"/><text x="757" y="507" class="title">Suites / Playwright / Newman</text><text x="757" y="536" class="small">Runner + logs + vídeo / HTML</text><text x="757" y="559" class="small">Extensibilidad por contrato de harness</text>
            <g fill="none" stroke="#86a0c0" stroke-width="2" marker-end="url(#ports-arrow)"><path d="M295 97 H355 M675 97 H735 M295 242 H355 M675 242 H735 M295 387 H355 M675 387 H735 M295 526 H355 M675 526 H735"/></g>
            <text x="31" y="620" class="small">Integraciones concretas actuales: Git/gh → GitHub PRs; drive_client → Google Drive. No hay adaptador GitLab/S3 implementado.</text>
          </svg>

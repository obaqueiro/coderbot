<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 405" role="img" aria-labelledby="v-title v-desc">
            <title id="v-title">Identidad de controles, reutilización y reparación</title><desc id="v-desc">Contenido, comando, entorno y dependencias definen la identidad. El controlador reutiliza resultados compatibles o ejecuta el plan. Fallos se comparan con base_sha y se reparan; solo un resultado válido pasa.</desc>
            <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7edf6;font-size:15px}.small{font-size:12px;fill:#aab9cf}.tiny{font-size:11px;fill:#aab9cf}.title{font-size:17px;font-weight:650}.box{fill:#18243a;stroke:#2b3b55;stroke-width:1.5}.ctl{fill:#152e48;stroke:#77baff;stroke-width:1.5}.human{fill:#332c25;stroke:#ffd080;stroke-width:1.5}.agent{fill:#29233e;stroke:#c4afff;stroke-width:1.5}.pass{fill:#15322e;stroke:#64dfbb;stroke-width:1.5}.fail{fill:#352630;stroke:#ffa6af;stroke-width:1.5}.edge{fill:none;stroke:#86a0c0;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.zone{fill:none;stroke:#2b3b55;stroke-width:1.5;stroke-dasharray:7 5}.mono{font-family:monospace;font-size:13px}</style><defs><marker id="verify-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86a0c0"/></marker></defs>
            <rect class="box" x="25" y="35" width="280" height="139" rx="12"/><text x="45" y="67" class="title">Identidad de ejecución</text><text x="45" y="95" class="small">Snapshot de inputs + comando</text><text x="45" y="120" class="small">Versiones + entorno + dependencias</text><text x="45" y="145" class="small">Revisión del entorno reparado</text>
            <rect class="ctl" x="365" y="35" width="315" height="139" rx="12"/><text x="388" y="67" class="title">Plan de controles completos</text><text x="388" y="96">Unit · test · lint · build · E2E</text><text x="388" y="122" class="small">Preparación + paralelismo limitado</text><text x="388" y="147" class="small">Locks exclusivos de recursos</text>
            <rect class="pass" x="740" y="35" width="315" height="139" rx="12"/><text x="764" y="67" class="title">Resultado + informe</text><text x="764" y="97">pass / fail / unknown / infrastructure</text><text x="764" y="123" class="small">outbox/checks/&lt;run&gt;/output.log</text><text x="764" y="148" class="small">execution.sqlite → check_run</text>
            <path class="edge" style="marker-end:url(#verify-arrow)" d="M305 101 H365 M680 101 H740"/>
            <rect class="box" x="25" y="253" width="280" height="115" rx="12"/><text x="45" y="286" class="title">Cache / baseline aislada</text><text x="45" y="313" class="small">Reuso compatible, no «ya pasó ayer»</text><text x="45" y="340" class="small">base_sha inmutable ≠ main actual</text>
            <rect class="fail" x="365" y="253" width="315" height="115" rx="12"/><text x="388" y="286" class="title">REPAIR_CHECKS</text><text x="388" y="313" class="small">Diagnóstico → implementación de fix</text><text x="388" y="340" class="small">Invalidar solo controles afectados</text>
            <rect class="pass" x="740" y="253" width="315" height="115" rx="12"/><text x="764" y="286" class="title">Puerta del controlador</text><text x="764" y="313" class="small">Estado real pass + gate pass</text><text x="764" y="340" class="small">Unknown / incomparables no avanzan</text>
            <path class="edge" style="marker-end:url(#verify-arrow)" d="M165 174 V253 M895 174 V253 M800 174 V212 H522 V253 M365 312 H305"/>
            <path class="edge dash" style="marker-end:url(#verify-arrow)" d="M522 253 V174"/>
          </svg>
